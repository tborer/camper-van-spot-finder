name: Deploy VanSpot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Build cell tower data
        run: node scripts/build-cell-data.js
        env:
          # Set OPENCELLID_API_KEY in repo Settings → Secrets & variables → Actions
          # If absent the script writes stub data and the build continues
          OPENCELLID_API_KEY: ${{ secrets.OPENCELLID_API_KEY }}

      - name: Build iOverlander spot data
        run: node scripts/build-ioverlander-data.js
        # No secret needed — public API fetched server-side to avoid browser CORS block
        # Build continues even if iOverlander is unreachable (script writes empty file)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
